<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EARN IT</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="EARN IT: turn real tasks into a virtual economy, with focus sessions, streaks, achievements and a customization store.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0b0b0d;--panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--text:#f5f2ea;--muted:#a19b8f;--gold:#d4af37;--gold2:#f6e27a;--green:#34c77b;--red:#f0565b;color-scheme:dark}
[data-theme=light]{--bg:#f7f5ef;--panel:rgba(255,255,255,.85);--line:rgba(0,0,0,.12);--text:#17150f;--muted:#6d675a;--green:#15834d;--red:#c62f35;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.5;color:var(--text);background:radial-gradient(900px 500px at 85% -10%,rgba(212,175,55,.14),transparent 60%),var(--bg)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.12em;font-size:1.2rem;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--line)}
main{max-width:1100px;margin-inline:auto;padding:18px 20px 100px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{grid-template-columns:1fr 1fr}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.22)}
.grid>.card,.two>.card{margin-top:0}
.stat small{color:var(--muted)}
.stat b{display:block;font-size:1.3rem;margin-top:4px}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted);font-size:.9rem}
button{font:inherit;cursor:pointer;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#15120a;border:0;font-weight:700}
button.danger{color:var(--red)}
nav button[aria-current=page]{border-color:var(--gold);color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.done{opacity:.55}.done b{text-decoration:line-through}
.tag{font-size:.75rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);display:inline-block}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s ease}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
h3{margin:.1rem 0 .7rem;font-size:1.05rem}
.banner{margin-top:14px;padding:12px 16px;border-radius:14px;border:1px solid var(--red);color:var(--red)}
#toast{position:fixed;bottom:18px;inset-inline:18px;max-width:380px;margin-inline:auto;padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
#toast.ok{border-color:var(--green)}#toast.err{border-color:var(--red)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;flex-direction:column;gap:2px;min-width:118px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);font-size:.85rem;background:var(--panel)}
.badge.off{opacity:.35;filter:grayscale(1)}
.r-common{border-color:#8d8d8d}.r-rare{border-color:#4f8ff7}.r-epic{border-color:#a855f7}
.r-legendary{border-color:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.35)}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.modal[hidden]{display:none}
.panel{width:min(460px,100%);padding:20px;border-radius:20px;background:var(--bg);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.5)}
.panel form{flex-direction:column;align-items:stretch}
.tbtn{margin-inline-start:8px;padding:4px 10px;border-radius:10px;border:1px solid var(--gold);color:var(--gold);background:transparent}
.ctitle{color:var(--gold);font-size:.85rem;font-weight:600}
.sw{display:block;width:100%;height:46px;border-radius:12px;margin-bottom:10px}
.cos{display:flex;flex-direction:column;gap:4px}
body[data-amb=amb_aurora]{background:radial-gradient(60% 50% at 15% 0%,rgba(52,199,123,.22),transparent 70%),radial-gradient(50% 40% at 90% 10%,rgba(59,130,246,.2),transparent 70%),var(--bg)}
body[data-amb=amb_stars]{background-color:var(--bg);background-image:radial-gradient(1px 1px at 20px 30px,rgba(255,255,255,.8),transparent),radial-gradient(1px 1px at 90px 80px,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 150px 50px,rgba(255,255,255,.9),transparent);background-size:170px 130px}
.timer{font-size:4.5rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.04em;background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.focus{display:flex;flex-direction:column;gap:12px}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
#fx .p{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
#fx .spark{width:7px;height:7px;border-radius:50%;top:42%;animation:burst 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:0}}
@keyframes burst{to{transform:translate(var(--dx),-70px) scale(.2);opacity:0}}
body[data-amb=amb_grid]{background-color:var(--bg);background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:36px 36px}
body[data-amb=amb_ember]{background:radial-gradient(70% 55% at 50% 110%,rgba(249,115,22,.35),transparent 70%),var(--bg)}
.chip{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.72rem;padding:2px 7px;border-radius:99px;border:1px solid var(--line);margin:2px 2px 2px 0}
.chip.done{border-color:var(--green)}.chip.due{border-color:var(--gold)}.chip.late{border-color:var(--red);color:var(--red)}.chip.focus{border-color:#60a5fa}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.cell{display:flex;flex-direction:column;align-items:stretch;text-align:start;min-height:84px;padding:6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);overflow:hidden;color:var(--text);font:inherit;cursor:default}
button.cell{cursor:pointer}.cell.out{opacity:.4}.cell.today{border-color:var(--gold)}.cell b{font-size:.85rem}
.hb{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;margin:8px 0}
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile-form{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.btn-like{display:inline-block;cursor:pointer;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.hav{background:none;border:0;padding:0;cursor:pointer}
.frame{position:relative;display:inline-block;border-radius:50%;padding:4px;isolation:isolate}
.frame::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:-1;display:none}
.frame.f-gold::before,.frame.f-flame::before,.frame.f-crystal::before{display:block}
.frame.f-gold::before{background:conic-gradient(#d4af37,#f6e27a,#b8860b,#f6e27a,#d4af37);animation:spin 4s linear infinite}
.frame.f-flame::before{background:conic-gradient(#f97316,#ef4444,#fde047,#f97316);animation:spin 2.5s linear infinite,glow 1.6s ease-in-out infinite}
.frame.f-crystal::before{background:conic-gradient(#38bdf8,#a78bfa,#34d399,#38bdf8);animation:spin 6s linear infinite}
.avatar{border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#15120a;font-weight:800;animation:breathe 4s ease-in-out infinite}
.avatar img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(249,115,22,.5))}50%{filter:drop-shadow(0 0 14px rgba(249,115,22,.95))}}
@media(prefers-reduced-motion:reduce){.frame::before,.avatar{animation:none!important}}
</style>
</head>

const ls = () => { try { return window.localStorage; } catch { return null; } };

function invariants(s) {
  const net = s.ledger.reduce((a, e) => a + e.amount, 0);
  const saved = s.goals.reduce((a, g) => a + g.saved, 0);
  const chain = s.ledger.every((e, i, a) => e.after === e.before + e.amount && e.before === (i + 1 < a.length ? a[i + 1].after : 0));
  const goals = s.goals.every(g => g.saved >= 0 && g.saved <= g.target);
  if (s.balance < 0 || s.savings < 0 || net !== s.balance || saved !== s.savings || !chain || !goals) throw new Error('invariant');
}

function loadState() {
  let raw = null;

// ---------- Transactions: every change runs on a draft, is checked, then persisted atomically ----------
class AppErr extends Error {}
const fail = code => { throw new AppErr(code); };
const ISO = /^\d{4}-\d{2}-\d{2}$/;
let note = '';

function toast(msg, kind = 'ok', action = null) {
  const el = $('#toast');
  el.replaceChildren(document.createTextNode(msg + note));
  note = '';
  if (action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tbtn'; b.textContent = action.label;
    b.onclick = () => { const r = action.fn(); if (r) render(); el.className = ''; };
    el.append(' ', b);
  }
  el.style.pointerEvents = action ? 'auto' : 'none';
  el.className = 'show ' + kind;
  clearTimeout(toast.h);
  toast.h = setTimeout(() => { el.className = ''; }, action ? 6000 : 3200);
}
const ok = k => toast(T(k), 'ok');

function post(d, type, amount, desc, ref) {
  const before = d.balance, after = before + amount;
  if (after < 0) fail('insufficient');
  d.balance = after;
  d.ledger.unshift({ id:uid(), ts:Date.now(), type, amount, before, after, desc, ref });
}

function run(fn) {
  const draft = JSON.parse(JSON.stringify(S));
  note = '';
  try {
    const out = fn(draft) ?? {};
    const L0 = levelOf(S.xp), L1 = levelOf(draft.xp);
    const got = unlockAchievements(draft);
    invariants(draft);
    if (!persist(draft)) fail('storage');
    S = draft;
    note = (L1 > L0 ? ` · ${T('levelUp')} ${L1}` : '') + got.map(id => ` · 🏆 ${T('ach.' + id + '.n')}`).join('');
    return out;
  } catch (e) {
    if (!(e instanceof AppErr)) console.error(e);
    toast(T('err.' + (e instanceof AppErr ? e.message : 'invalid')), 'err');
    return null;
  }
}
const done = (fn, msg) => { const r = run(fn); if (r && msg) ok(msg); return r; };

// ---------- Tasks ----------
const isRec = t => t.freq === 'daily' || t.freq === 'weekly';
function parseTask(f) {
  const title = (f.title || '').trim(), reward = toP(f.reward);
  if (!title || title.length > 200 || reward === null || reward > 1000000 || !DIFF[f.difficulty]) fail('invalid');
  if (f.due && !ISO.test(f.due)) fail('invalid');
  const freq = ['none', 'daily', 'weekly'].includes(f.freq) ? f.freq : 'none';
  return { title, reward, difficulty: f.difficulty, freq, due: f.due || (freq === 'none' ? '' : today()) };
}
const addTask = f => done(d => { d.tasks.unshift({ id: uid(), ...parseTask(f), status: 'pending', completedAt: null, xp: 0, history: [] }); }, 'added');
const updateTask = (id, f) => done(d => {
  const t = d.tasks.find(x => x.id === id);
  if (!t) fail('notfound');
  if (t.status === 'completed') fail('completedLocked');
  Object.assign(t, parseTask(f));
}, 'savedOk');
function completeTask(id) {
  const r = run(d => {
    const t = d.tasks.find(x => x.id === id);
    if (!t) fail('notfound');
    const xp = XPD[t.difficulty];
    if (isRec(t)) {
      if (t.due > today()) fail('notDue');
      const h = { id: uid(), date: t.due, ts: Date.now(), reward: t.reward, xp, prevDue: t.due };
      if (t.history.some(x => x.date === h.date)) fail('already');
      t.due = addDays(t.due < today() ? today() : t.due, t.freq === 'daily' ? 1 : 7);
      t.history.unshift(h); d.xp += xp; d.lifetime += t.reward;
      if (t.reward > 0) post(d, 'task_reward', t.reward, t.title, t.id);
      return { hid: h.id };
    }
    if (t.status === 'completed') fail('already');
    t.status = 'completed'; t.completedAt = Date.now(); t.xp = xp;
    d.xp += xp; d.lifetime += t.reward;
    if (t.reward > 0) post(d, 'task_reward', t.reward, t.title, t.id);
    return {};
  });
  if (r) { celebrate(); toast(T('completedMsg'), 'ok', { label: T('undo'), fn: () => undoComplete(id, r.hid) }); }
  return r;
}
function undoComplete(id, hid) {
  const r = run(d => {
    const t = d.tasks.find(x => x.id === id);
    if (!t) fail('invalid');
    if (isRec(t)) {
      const h = t.history[0];
      if (!h || h.id !== hid) fail('invalid');
      if (h.reward > 0) post(d, 'reversal', -h.reward, t.title, t.id);
      d.lifetime -= h.reward; d.xp -= h.xp; t.due = h.prevDue; t.history.shift();
      return;
    }
    if (t.status !== 'completed') fail('invalid');
    if (t.reward > 0) post(d, 'reversal', -t.reward, t.title, t.id);
    d.lifetime -= t.reward; d.xp -= t.xp;
    t.status = 'pending'; t.completedAt = null; t.xp = 0;
  });
  if (r) ok('undone');
  return r;
}
const deleteTask = id => done(d => {
  const i = d.tasks.findIndex(x => x.id === id);
  if (i < 0) fail('notfound');
  if (d.tasks[i].status === 'completed' || d.tasks[i].history.length) fail('pendingOnly');
  d.tasks.splice(i, 1);
}, 'deleted');
const postponeTask = id => done(d => {
  const t = d.tasks.find(x => x.id === id);
  if (!t) fail('notfound');
  if (t.status === 'completed') fail('completedLocked');
  t.due = addDays(t.due && t.due > today() ? t.due : today(), 1);
}, 'postponed');
const duplicateTask = id => done(d => {
  const t = d.tasks.find(x => x.id === id);
  if (!t) fail('notfound');
  d.tasks.unshift({ ...t, id: uid(), title: t.title.slice(0, 190) + T('copySuffix'), status: 'pending', completedAt: null, xp: 0, history: [] });
}, 'duplicated');

// ---------- Shop ----------
const addReward = f => done(d => {
  const name = (f.name || '').trim(), price = toP(f.price);
  if (!name || name.length > 120 || !price || price > 10000000 || !CATS.includes(f.category)) fail('invalid');
  d.rewards.unshift({ id:uid(), name, category:f.category, price, archived:false });
}, 'added');
const archiveReward = id => done(d => {
  const r = d.rewards.find(x => x.id === id);
  if (!r) fail('notfound');
  r.archived = true;
}, 'archived');
function buy(rid, key) {
  const r = run(d => {
    if (d.used[key]) return { replayed:true };
    const rw = d.rewards.find(x => x.id === rid && !x.archived);
    if (!rw) fail('notfound');
    post(d, 'shop_purchase', -rw.price, rw.name, rw.id);
    d.spending += rw.price;
    const p = { id:uid(), rewardId:rw.id, name:rw.name, price:rw.price, status:'purchased', ts:Date.now() };
    d.purchases.unshift(p); d.used[key] = p.id;
    return { purchase: p };
  });
  if (r && r.replayed) ok('dup');
  else if (r) toast(T('bought'), 'ok', { label: T('undo'), fn: () => refund(r.purchase.id) });
  return r;
}
function refund(pid) {
  const r = run(d => {
    const p = d.purchases.find(x => x.id === pid);
    if (!p || p.status !== 'purchased') fail('invalid');
    post(d, 'refund', p.price, p.name, p.id);
    d.spending -= p.price; p.status = 'refunded';
  });
  if (r) ok('refunded');
  return r;
}
function redeem(pid) {
  const r = run(d => {
    const p = d.purchases.find(x => x.id === pid);
    if (!p) fail('notfound');
    if (p.status === 'redeemed') return { already: true };
    if (p.status !== 'purchased') fail('invalid');
    p.status = 'redeemed'; p.redeemedAt = Date.now();
  });
  if (r && !r.already) ok('redeemed');
  return r;
}

// ---------- Savings ----------
function addGoal(f) {
  return done(d => {
    const name = (f.name || '').trim(), target = toP(f.target);
    if (!name || name.length > 120 || !target || target > 10000000) fail('invalid');
    if (f.date && !/^\d{4}-\d{2}-\d{2}$/.test(f.date)) fail('invalid');
    d.goals.unshift({ id:uid(), name, target, saved:0, date:f.date || '', status:'active' });
  }, 'goalAdded');
}

function deposit(gid, amount, key) {
  const r = run(d => {
    if (d.used[key]) return { replayed:true };
    const g = d.goals.find(x => x.id === gid);
    if (!g) fail('notfound');
    if (g.status !== 'active') fail('notActive');
    if (!amount || amount <= 0) fail('invalid');
    if (amount > g.target - g.saved) fail('exceeds');
    post(d, 'savings_deposit', -amount, g.name, g.id);
    g.saved += amount; d.savings += amount; d.used[key] = g.id;
    if (g.saved === g.target) g.status = 'completed';
    return { completed: g.status === 'completed' };
  });
  if (r) ok(r.replayed ? 'dup' : r.completed ? 'goalDone' : 'depOk');
  return r;
}

function withdraw(gid, amount, key) {
  const r = run(d => {
    if (d.used[key]) return { replayed:true };
    const g = d.goals.find(x => x.id === gid);
    if (!g) fail('notfound');
    if (!amount || amount <= 0) fail('invalid');
    if (amount > g.saved || amount > d.savings) fail('savedLow');
    post(d, 'savings_withdrawal', amount, g.name, g.id);
    g.saved -= amount; d.savings -= amount; d.used[key] = g.id;
    if (g.status === 'completed') g.status = 'active';
  });
  if (r) ok(r.replayed ? 'dup' : 'wdOk');
  return r;
}

function reportOf(a, b) {

function analyticsData(R) {

  const diffOf = Object.fromEntries(S.tasks.map(t => [t.id, t.difficulty]));
  const catOfReward = Object.fromEntries(S.rewards.map(r => [r.id, r.category]));
  const rewardOfPurchase = Object.fromEntries(S.purchases.map(p => [p.id, p.rewardId]));
  const byDiff = {}, bySpend = {};
  L.forEach(e => {
    if (e.type === 'task_reward' || e.type === 'reversal') { const k = diffOf[e.ref] || 'other'; byDiff[k] = (byDiff[k] || 0) + e.amount; }
    if (e.type === 'shop_purchase' || e.type === 'refund') {
      const rid = e.type === 'refund' ? rewardOfPurchase[e.ref] : e.ref;
      const k = catOfReward[rid] || (cosById(e.ref) ? 'cosmetic' : 'other');
      bySpend[k] = (bySpend[k] || 0) - e.amount;

  });

  const buckets = R === 1

    : Array.from({ length: R }, (_, i) => ({ lo: a + i * 864e5, hi: a + (i + 1) * 864e5, label: fmtShort(ymd(new Date(a + i * 864e5))) }));
  const trend = buckets.map(x => S.ledger.filter(e => (e.type === 'task_reward' || e.type === 'reversal') && e.ts >= x.lo && e.ts < x.hi).reduce((s, e) => s + e.amount, 0));

}

// ---------- Calendar: day / week / month, from tasks, recurring schedules, and focus sessions ----------
function calEvents(from, to) {
  const map = {}, add = (d, e) => { if (d >= from && d <= to) (map[d] ||= []).push(e); };
  const td = today();
  S.tasks.forEach(t => {
    if (isRec(t)) {
      t.history.forEach(h => add(h.date, { k: 'done', t: t.title }));
      if (t.status === 'pending' && t.due) {
        const step = t.freq === 'daily' ? 1 : 7;
        let d = t.due;
        if (d < from) d = addDays(d, Math.ceil(dayDiff(d, from) / step) * step);
        for (let n = 0; d <= to && n < 400; n++, d = addDays(d, step)) add(d, { k: d < td ? 'late' : 'due', t: t.title });
      }
    } else if (t.status === 'completed' && t.completedAt) add(ymd(new Date(t.completedAt)), { k: 'done', t: t.title });
    else if (t.status === 'pending' && t.due) add(t.due, { k: t.due < td ? 'late' : 'due', t: t.title });
  });
  S.focus.forEach(f => add(ymd(new Date(f.ts)), { k: 'focus', t: `${f.min} ${T('minutes')}` }));
  return map;
}
function calRange() {
  const m = ui.cal.mode, d = ui.cal.date;
  if (m === 'day') return [d, d];
  if (m === 'week') { const s = addDays(d, -WEEK_OFF(d)); return [s, addDays(s, 6)]; }
  const first = d.slice(0, 8) + '01', s = addDays(first, -WEEK_OFF(first));

}

  if (mode === 'week') return addDays(d, 7 * dir);

}

function pickAvatar(file) {

const NOTIF_KEY = 'earnit.notif';
function remindersTick() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  let seen = [];
  try { seen = JSON.parse(ls()?.getItem(NOTIF_KEY) || '[]'); } catch {}
  const td = today(), fresh = [];
  S.tasks.filter(t => t.status === 'pending' && t.due === td).forEach(t => fresh.push({ k: 'due:' + t.id + ':' + td, title: T('notifDue'), body: t.title }));
  MISSIONS.forEach(m => { if (missionState(S, m).ready) fresh.push({ k: 'mis:' + missionKey(m, bounds(m.period).key), title: T('notifMission'), body: T('mis.' + m.id) }); });
  fresh.filter(n => !seen.includes(n.k)).forEach(n => { new Notification('EARN IT', { body: `${n.title}: ${n.body}`, tag: n.k }); seen.push(n.k); });
  try { ls()?.setItem(NOTIF_KEY, JSON.stringify(seen.slice(-200))); } catch {}
}

        <button type="button" data-act="notify">${notifLabel()}</button>
      </div>
      <p class="muted" style="margin:8px 0 0">${T('framesHint')}</p>
      <p class="muted" style="margin:4px 0 0">${T('installHint')}</p>
    </div></section>
    <section class="card">
      <div class="actions" style="justify-content:space-between"><h3 style="margin:0">${T('reports')}</h3>
        <div class="actions">
          <button type="button" data-act="rep" data-r="week" ${rep === 'week' ? 'aria-current="true"' : ''}>${T('week')}</button>
          <button type="button" data-act="rep" data-r="month" ${rep === 'month' ? 'aria-current="true"' : ''}>${T('month')}</button>
        </div></div>
      <p class="muted">${T('vsPrev')}</p>
      <div class="grid">${card('done', T('rep.done'), String)}${card('earned', T('rep.earned'), fmt)}${card('spent', T('rep.spent'), fmt)}${card('saved', T('rep.saved'), fmt)}${card('focus', T('rep.focus'), v => `${v} ${T('minutes')}`)}${card('missions', T('rep.missions'), String)}</div>
    </section>`;
  },

  shop() {
    const cards = S.rewards.filter(r => !r.archived).map(r => {
      const can = S.balance >= r.price;
      return `<section class="card"><b>${esc(r.name)}</b><div class="muted">${T('cats.' + r.category)}</div>
        <div class="row" style="border:0;padding:8px 0 0"><b>${fmt(r.price)}</b>
        <div class="actions"><button class="primary" type="button" data-act="buy" data-id="${r.id}" ${can ? '' : 'disabled'}>${T('buy')}</button>
        <button class="danger" type="button" data-act="archreward" data-id="${r.id}">${T('archive')}</button></div></div>
        ${can ? '' : `<p class="neg" style="margin:6px 0 0;font-size:.85rem">${T('err.insufficient')}</p>`}</section>`;
    }).join('');
    const hist = S.purchases.map(p => `<div class="row"><div><b>${esc(p.name)}</b><div class="muted">${fmtDate(p.ts)}</div></div>
      <div class="actions"><span class="tag">${p.status === 'redeemed' ? T('statusRedeemed') : p.status === 'refunded' ? T('statusRefunded') : T('purchased')}</span>
      ${p.status === 'purchased' ? `<button type="button" data-act="redeem" data-id="${p.id}">${T('redeem')}</button>` : ''}</div></div>`).join('');
    return `
    <section class="card"><h3>${T('newReward')}</h3><form data-form="reward">
      <label>${T('rewardName')}<input name="name" required maxlength="120"></label>
      <label>${T('category')}<select name="category">${CATS.map(c => `<option value="${c}">${T('cats.' + c)}</option>`).join('')}</select></label>
      <label>${T('price')}<input name="price" inputmode="decimal" required style="width:120px"></label>
      <button class="primary" type="submit">${T('add')}</button>
    </form></section>
    <section class="grid" style="margin-top:14px">${cards || `<p class="muted">${T('noRewards')}</p>`}</section>
    ${cosSection()}<section class="card"><h3>${T('purchases')}</h3>${hist || `<p class="muted">${T('none')}</p>`}</section>`;
  },

  savings() {
    const goals = S.goals.map(g => {
      const pct = Math.min(100, Math.round(g.saved / g.target * 100));
      return `<section class="card goal"><div class="row" style="border:0;padding:0"><b>${esc(g.name)}</b>
        <span class="tag ${g.status === 'completed' ? 'pos' : ''}">${g.status === 'completed' ? T('goalDone') : pct + '%'}</span></div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
        <p class="muted">${fmt(g.saved)} / ${fmt(g.target)}${g.date ? ' · ' + esc(g.date) : ''}</p>
        <div class="actions"><input inputmode="decimal" placeholder="${T('amount')}" aria-label="${T('amount')}" style="width:130px">
          <button class="primary" type="button" data-act="dep" data-id="${g.id}" ${g.status === 'active' ? '' : 'disabled'}>${T('deposit')}</button>
          <button type="button" data-act="wd" data-id="${g.id}">${T('withdraw')}</button></div></section>`;
    }).join('');
    return `
    <section class="card"><h3>${T('newGoal')}</h3><form data-form="goal">
      <label>${T('goal')}<input name="name" required maxlength="120"></label>
      <label>${T('target')}<input name="target" inputmode="decimal" required style="width:150px"></label>
      <label>${T('targetDate')}<input type="date" name="date"></label>
      <button class="primary" type="submit">${T('add')}</button>
    </form></section>
    <div class="grid" style="margin-top:14px">${goals || `<p class="muted">${T('noGoals')}</p>`}</div>`;
  },

  wallet() {
    const rows = S.ledger.slice(0, 200).map(e => `<tr><td>${fmtDate(e.ts)}</td><td>${T('ltype.' + e.type)}</td><td>${esc(e.desc)}</td>
      <td class="${e.amount > 0 ? 'pos' : 'neg'}">${sign(e.amount)}</td><td>${fmt(e.after)}</td></tr>`).join('');
    return `
    <section class="card"><div class="row" style="border:0">
      <div><span class="muted">${T('balance')}</span><h3 style="font-size:1.6rem;margin:4px 0">${fmt(S.balance)}</h3></div>
      <div class="actions"><button type="button" data-act="export">${T('exportData')}</button> <button type="button" data-act="csv">${T('exportCsv')}</button>
      <button class="danger" type="button" data-act="reset">${T('resetData')}</button></div></div></section>
    <section class="card" style="overflow:auto">${S.ledger.length
      ? `<table><thead><tr><th>${T('date')}</th><th>${T('type')}</th><th>${T('desc')}</th><th>${T('amountCol')}</th><th>${T('after')}</th></tr></thead><tbody>${rows}</tbody></table>`
      : `<p class="muted">${T('noLedger')}</p>`}</section>`;
  },
};

// ---------- Rendering & events ----------
function render() {
  const root = document.documentElement;
  root.lang = ui.lang; root.dir = ui.lang === 'ar' ? 'rtl' : 'ltr'; root.dataset.theme = ui.theme;
  $('#tag').textContent = T('tagline');
  $('#langBtn').textContent = T('lang');
  $('#themeBtn').textContent = T(ui.theme === 'dark' ? 'toLight' : 'toDark');
  $('#nav').innerHTML = ['dashboard', 'tasks', 'calendar', 'focus', 'analytics', 'shop', 'savings', 'wallet', 'profile'].map(t =>
    `<button type="button" data-act="tab" data-tab="${t}" ${ui.tab === t ? 'aria-current="page"' : ''}>${T('nav.' + t)}</button>`).join('');
  const banner = ui.banner ? `<div class="banner" role="alert">${T(ui.banner)}</div>` : '';
  ui.banner = '';
  applyCos();
  $('#hav').innerHTML = `<button type="button" class="hav" data-act="tab" data-tab="profile" aria-label="${T('nav.profile')}">${avatarHTML(36)}</button>`;
  $('#app').innerHTML = banner + VIEWS[ui.tab]();
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const { act, id } = el.dataset;
  let r = true;
  switch (act) {
    case 'tab': ui.tab = el.dataset.tab; break;
    case 'filter': ui.filter = el.dataset.f; break;
    case 'lang': ui.lang = ui.lang === 'ar' ? 'en' : 'ar'; savePrefs(); break;
    case 'theme': ui.theme = ui.theme === 'dark' ? 'light' : 'dark'; savePrefs(); break;
    case 'complete': r = completeTask(id); break;
    case 'deltask': r = (await confirmBox(T('deleteConfirm'))) ? deleteTask(id) : true; break;
    case 'edit': editTaskModal(id); r = false; break;
    case 'postpone': r = postponeTask(id); break;
    case 'dup': r = duplicateTask(id); break;
    case 'buy': r = (await confirmBox(T('confirmBuy'))) ? buy(id, uid()) : true; break;
    case 'redeem': r = redeem(id); break;
    case 'archreward': r = archiveReward(id); break;
    case 'cosbuy': r = (await confirmBox(T('confirmBuy'))) ? buyCosmetic(id, uid()) : true; break;
    case 'coseq': r = equipCos(id); break;
    case 'fstart': FOCUS.timer ? focusPause() : focusStart(); break;
    case 'freset': focusReset(); break;
    case 'claim': r = claimMission(id); break;
    case 'calnav': { const dir = Number(el.dataset.dir); ui.cal.date = dir === 0 ? today() : shiftCal(ui.cal.date || today(), ui.cal.mode, dir); break; }
    case 'calmode': ui.cal.mode = el.dataset.m; break;
    case 'calday': ui.cal.date = el.dataset.d; ui.cal.mode = 'day'; break;
    case 'range': ui.range = Number(el.dataset.r); break;
    case 'rep': ui.rep = el.dataset.r; break;
    case 'avremove': r = removeAvatar(); break;
    case 'notify': if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); break;
    case 'dep': r = deposit(id, toP(el.closest('.goal').querySelector('input').value), uid()); break;
    case 'wd': r = withdraw(id, toP(el.closest('.goal').querySelector('input').value), uid()); break;
    case 'export': exportData(); break;
    case 'csv': exportCsv(); break;
    case 'reset': r = await resetAll(); break;
    case 'modal-ok': closeModal(true); r = false; break;
    case 'modal-no': closeModal(false); r = false; break;
  }
  if (r) render();
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)), form = e.target.dataset.form;
  if (form === 'edit') { if (updateTask(e.target.dataset.id, f)) { closeModal(true); render(); } return; }
  const action = { task: addTask, reward: addReward, goal: addGoal, profile: saveProfile }[form];
  if (action && action(f)) render();
});

document.addEventListener('change', e => {
  if (e.target.name === 'difficulty') e.target.form.elements.reward.value = mid(e.target.value);
  if (e.target.id === 'sort') { ui.sort = e.target.value; $('#tlist').innerHTML = taskList(); }
  if (e.target.id === 'flen') { FOCUS.len = Number(e.target.value); if (!FOCUS.timer) FOCUS.left = FOCUS.len * 60; render(); }
  if (e.target.id === 'ftask') FOCUS.tid = e.target.value;
  if (e.target.name === 'avatar') pickAvatar(e.target.files[0]);
});

document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; $('#tlist').innerHTML = taskList(); }
});

document.addEventListener('keydown', e => {
  const m = modalEl();
  if (!m.hidden) {
    if (e.key === 'Escape') closeModal(false);
    if (e.key === 'Tab') {
      const f = [...m.querySelectorAll('input,select,button')], i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i < 0 || i === f.length - 1 ? 0 : i + 1)]?.focus();
    }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.matches('input,textarea,select')) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); ui.tab = 'tasks'; render(); $('input[name=title]')?.focus(); }
  else if (e.key === '/') { e.preventDefault(); ui.tab = 'tasks'; render(); $('#q')?.focus(); }
});

modalEl().addEventListener('click', e => { if (e.target === modalEl()) closeModal(false); });
loadPrefs();
S = loadState();
render();
greet();
remindersTick();
setInterval(remindersTick, 60000);
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
